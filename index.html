    // ข้อมูลตัวอย่างในพื้นที่กรุงเทพมหานคร (คลองเตย / พระราม 4 / อนุสาวรีย์ฯ / ลาดพร้าว)

      },
      {

        phone: "089-876-5432",
        addressName: "หอพักสุขสันต์ ซอยรางน้ำ เขตราชเทวี",

        name: "คุณมานี มีสุข",
        phone: "086-555-1234",

        roomFloor: "บ้านเลขที่ 19/4",
        lat: 13.7885,
        lng: 100.6295,

        bedridden: false,
        status: "waiting"
      },
      {
        id: "h4",
        name: "คุณป้าวิไล พรหมมา",
        phone: "082-444-9876",
        addressName: "แฟลตดินแดง อาคาร 5 ถ.ประชาสงเคราะห์",
        roomFloor: "ชั้น 4 ห้อง 411",
        lat: 13.7670,

        bedridden: true,
        status: "waiting"
      }
    ];

    // ตำแหน่งเริ่มต้นทีมอาสาสมัครในกรุงเทพฯ
    const initialVolunteers = [
      { id: "v1", name: "หน่วยอาสา 01 (โซนคลองเตย-พระราม 4)", lat: 13.7180, lng: 100.5640 },
      { id: "v2", name: "หน่วยอาสา 02 (โซนดินแดง-ราชเทวี)", lat: 13.7630, lng: 100.5460 },
      { id: "v3", name: "หน่วยอาสา 03 (โซนลาดพร้าว-บางกะปิ)", lat: 13.7830, lng: 100.6240 }
    ];

    // คอมโพเนนต์แผนที่ Google Maps จริง (ผ่าน Leaflet)
    function BangkokGoogleMap({ 
      households, 
      volunteers, 
      mode, // 'resident' | 'volunteer'
      selectedLat, 
      selectedLng, 
      onLocationSelect,
      focusCoords,
      lang
    }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersLayerRef = useRef(null);
      const streetLayerRef = useRef(null);
      const satLayerRef = useRef(null);
      const [mapType, setMapType] = useState('street'); // 'street' | 'satellite'

      // สร้างแผนที่ครั้งแรก
      useEffect(() => {
        if (!mapContainerRef.current || mapInstanceRef.current) return;

        // ศูนย์กลางกรุงเทพมหานคร
        const bkkCenter = [13.7563, 100.5018];
        const map = L.map(mapContainerRef.current, {
          center: bkkCenter,
          zoom: 12,
          zoomControl: true
        });

        // Google Maps Street Layer (ภาษาไทย)
        const googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=th&x={x}&y={y}&z={z}', {
          maxZoom: 20,
          attribution: '© Google Maps'
        });

        // Google Maps Hybrid Satellite Layer (ภาพดาวเทียมพร้อมชื่อถนน)
        const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&hl=th&x={x}&y={y}&z={z}', {
          maxZoom: 20,
          attribution: '© Google Maps'
        });

        googleStreets.addTo(map);
        streetLayerRef.current = googleStreets;
        satLayerRef.current = googleHybrid;

        const layerGroup = L.layerGroup().addTo(map);
        markersLayerRef.current = layerGroup;
        mapInstanceRef.current = map;

        // คลิกบนแผนที่เพื่อเลือกพิกัด (สำหรับโหมดประชาชน)
        map.on('click', (e) => {
          if (onLocationSelect) {
            onLocationSelect(e.latlng.lat, e.latlng.lng);
          }
        });

        return () => {
          map.remove();
          mapInstanceRef.current = null;
        };
      }, []);

      // สลับโหมดแผนที่ ถนน / ดาวเทียม
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map || !streetLayerRef.current || !satLayerRef.current) return;

        if (mapType === 'street') {
          map.removeLayer(satLayerRef.current);
          streetLayerRef.current.addTo(map);
        } else {
          map.removeLayer(streetLayerRef.current);
          satLayerRef.current.addTo(map);
        }
      }, [mapType]);

      // เลื่อนกล้องไปยังจุดที่เลือก
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (map && focusCoords) {
          map.flyTo([focusCoords.lat, focusCoords.lng], 15, { duration: 1 });
        }
      }, [focusCoords]);

      // วาดหมุดและรัศมี 500 เมตรลงบนแผนที่
      useEffect(() => {
        const layerGroup = markersLayerRef.current;
        if (!layerGroup) return;
        layerGroup.clearLayers();

        // ฟังก์ชันสร้างหมุด HTML สวยงาม
        const createCustomIcon = (color, emoji, label) => {
          return L.divIcon({
            className: 'custom-map-pin',
            html: `
              <div style="display:flex; flex-direction:column; align-items:center; transform: translate(-50%, -100%);">
                <div style="background:${color}; color:white; width:34px; height:34px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; border:2.5px solid white; box-shadow:0 3px 8px rgba(0,0,0,0.35);">
                  <span style="transform:rotate(45deg); font-size:16px;">${emoji}</span>
                </div>
                ${label ? `<span style="background:rgba(15,23,42,0.85); color:white; font-size:11px; padding:1px 6px; border-radius:4px; margin-top:3px; white-space:nowrap; font-family:Sarabun,sans-serif;">${label}</span>` : ''}
              </div>
            `,
            iconSize: [0, 0],
            iconAnchor: [0, 0]
          });
        };

        if (mode === 'resident') {
          // โหมดประชาชน: แสดงเฉพาะหมุดบ้านที่กำลังปักหมุด (รักษาความเป็นส่วนตัวของบ้านอื่น)
          if (selectedLat && selectedLng) {
            const pinIcon = createCustomIcon('#16a34a', '🏠', lang === 'th' ? 'จุดส่งของของคุณ' : 'Your Location');
            L.marker([selectedLat, selectedLng], { icon: pinIcon })
              .addTo(layerGroup)
              .bindPopup(`<b>${lang === 'th' ? 'พิกัดที่เลือก' : 'Selected Location'}</b><br/>Lat: ${selectedLat.toFixed(5)}, Lng: ${selectedLng.toFixed(5)}`);
          }
        } else {
          // โหมดอาสาสมัคร: แสดงครัวเรือนทั้งหมด + ทีมอาสา + รัศมี 500 เมตร
          households.forEach((h) => {
            let color = '#eab308'; // รอจัดส่ง (เหลือง)
            let emoji = '📦';
            if (h.status === 'delivered') {
              color = '#16a34a'; // ส่งแล้ว (เขียว)
              emoji = '✅';
            } else if (h.bedridden) {
              color = '#dc2626'; // ผู้ป่วยติดเตียง (แดง)
              emoji = '🛏️';
            } else if (h.elderly) {
              color = '#f97316'; // ผู้สูงอายุ (ส้ม)
              emoji = '👴';
            }

            const icon = createCustomIcon(color, emoji, h.name.split(' ')[0]);
            const marker = L.marker([h.lat, h.lng], { icon }).addTo(layerGroup);
            
            const statusText = h.status === 'delivered' ? 'จัดส่งสำเร็จ' : h.status === 'nearby' ? 'อาสาสมัครอยู่ใกล้ (<500ม.)' : 'รอจัดส่ง';
            marker.bindPopup(`
              <div style="font-family:Sarabun,sans-serif; min-width:180px;">
                <div style="font-weight:bold; font-size:14px; color:#0f172a;">${h.name}</div>
                <div style="font-size:12px; color:#475569; margin-top:2px;">📍 ${h.addressName} (${h.roomFloor})</div>
                <div style="font-size:12px; color:#475569;">📞 ${h.phone}</div>
                <div style="margin-top:6px; padding-top:4px; border-top:1px solid #e2e8f0; font-size:12px;">
                  สถานะ: <b>${statusText}</b>
                </div>
              </div>
            `);
          });

          // แสดงทีมอาสาสมัครและวงกลมรัศมี 500 เมตร
          volunteers.forEach((v) => {
            const vIcon = createCustomIcon('#2563eb', '🚐', v.name.split(' ')[0]);
            L.marker([v.lat, v.lng], { icon: vIcon })
              .addTo(layerGroup)
              .bindPopup(`<b>${v.name}</b><br/>รัศมีแจ้งเตือนอัตโนมัติ: 500 เมตร`);

            // วงกลมรัศมี 500 เมตร
            L.circle([v.lat, v.lng], {
              radius: 500,
              color: '#3b82f6',
              weight: 1.5,
              fillColor: '#3b82f6',
              fillOpacity: 0.12
            }).addTo(layerGroup);
          });
        }
      }, [households, volunteers, mode, selectedLat, selectedLng, lang]);

      return (
        <div className="relative w-full h-full">
          {/* ปุ่มสลับมุมมองแผนที่ Google Maps */}
          <div className="absolute top-3 right-3 z-20 bg-white/95 backdrop-blur shadow-md rounded-lg p-1 flex border border-slate-200 text-xs font-medium">
            <button
              type="button"
              onClick={() => setMapType('street')}
              className={`px-2.5 py-1 rounded-md transition ${mapType === 'street' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              🗺️ {t[lang].mapStreet}
            </button>
            <button
              type="button"
              onClick={() => setMapType('satellite')}
              className={`px-2.5 py-1 rounded-md transition ${mapType === 'satellite' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
            >
              🛰️ {t[lang].mapSat}
            </button>
          </div>

          <div ref={mapContainerRef} className="w-full h-full" />
        </div>
      );
    }

    function App() {
      const [lang, setLang] = useState('th');
      const [activeTab, setActiveTab] = useState('resident'); // 'resident' | 'volunteer'
      const [isVolunteerAuthenticated, setIsVolunteerAuthenticated] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);

      // ข้อมูลหลักในระบบ
      const [households, setHouseholds] = useState(() => {
        const saved = localStorage.getItem('thuengmue_bkk_households');
        return saved ? JSON.parse(saved) : initialHouseholds;
      });
      const [volunteers, setVolunteers] = useState(initialVolunteers);
      const [simulationActive, setSimulationActive] = useState(false);

      // ฟอร์มลงทะเบียนประชาชน (ค่าเริ่มต้นใจกลางกรุงเทพฯ - อนุสาวรีย์ชัยฯ)
      const [formName, setFormName] = useState('');
      const [formPhone, setFormPhone] = useState('');
      const [formAddress, setFormAddress] = useState('');
      const [formRoom, setFormRoom] = useState('');
      const [formElderly, setFormElderly] = useState(false);
      const [formBedridden, setFormBedridden] = useState(false);
      const [formLat, setFormLat] = useState(13.7649);
      const [formLng, setFormLng] = useState(100.5383);
      const [focusCoords, setFocusCoords] = useState(null);

      const [registeredId, setRegisteredId] = useState(localStorage.getItem('thuengmue_bkk_my_id') || null);
      const [successMsg, setSuccessMsg] = useState('');
      const [searchQuery, setSearchQuery] = useState('');

      // บันทึกข้อมูลลง LocalStorage
      useEffect(() => {
        localStorage.setItem('thuengmue_bkk_households', JSON.stringify(households));
      }, [households]);

      useEffect(() => {
        if (registeredId) {
          localStorage.setItem('thuengmue_bkk_my_id', registeredId);
        } else {
          localStorage.removeItem('thuengmue_bkk_my_id');
        }
      }, [registeredId]);

      // ระบบเสียงแจ้งเตือน + เสียงพูดภาษาไทย/อังกฤษ
      const triggerAlert = (msg) => {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);

          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(msg);
            utterance.lang = lang === 'th' ? 'th-TH' : 'en-US';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
          }
        } catch (e) {
          console.log("Audio alert blocked by browser policy until user interaction");
        }
      };

      // คำนวณระยะทางจริงบนพื้นโลก (Haversine Formula - หน่วยเมตร)
      const calculateDistance = (lat1, lon1, lat2, lon2) => {
        const R = 6371e3;
        const φ1 = (lat1 * Math.PI) / 180;
        const φ2 = (lat2 * Math.PI) / 180;
        const Δφ = ((lat2 - lat1) * Math.PI) / 180;
        const Δλ = ((lon2 - lon1) * Math.PI) / 180;

        const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                  Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      };

      // จำลองการเคลื่อนที่ของรถอาสาสมัครเข้าหาบ้านที่รอรับของ
      useEffect(() => {
        if (!simulationActive) return;

        const interval = setInterval(() => {
          setVolunteers((prevVolunteers) =>
            prevVolunteers.map((v, idx) => {
              // หาบ้านที่ยังรอรับของเพื่อให้รถอาสาวิ่งเข้าไปหาอย่างสมจริง
              const waitingTargets = households.filter(h => h.status !== 'delivered');
              if (waitingTargets.length === 0) return v;

              const target = waitingTargets[idx % waitingTargets.length];
              const dLat = target.lat - v.lat;
              const dLng = target.lng - v.lng;
              const dist = Math.sqrt(dLat * dLat + dLng * dLng);

              if (dist < 0.0005) return v; // ถึงจุดหมายแล้ว

              // ขยับเข้าหาเป้าหมายทีละนิด
              const step = 0.0012;
              return {
                ...v,
                lat: v.lat + (dLat / dist) * step,
                lng: v.lng + (dLng / dist) * step
              };
            })
          );
        }, 1500);

        return () => clearInterval(interval);
      }, [simulationActive, households]);

      // ตรวจสอบระยะห่าง 500 เมตรแบบเรียลไทม์
      useEffect(() => {
        setHouseholds((prevHouseholds) =>
          prevHouseholds.map((h) => {
            if (h.status === 'delivered') return h;

            const isWithin500m = volunteers.some(
              (v) => calculateDistance(h.lat, h.lng, v.lat, v.lng) <= 500

              return { ...h, status: 'nearby' };

            setFormLng(longitude);

                  </div>
                ) : (
                  /* หน้าแดชบอร์ดเมื่อเจ้าหน้าที่ยืนยันตัวตนสำเร็จ */
                  <div className="space-y-6">
                    
                    {/* แถบเครื่องมือด้านบนของเจ้าหน้าที่ */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
                      <div className="flex items-center gap-3">
                        <span className="bg-emerald-100 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-lg">
                          ● STAFF ACTIVE
                        </span>
                        <h2 className="text-base sm:text-lg font-bold text-slate-900">{t[lang].volunteerDashboard}</h2>
                      </div>

                      <div className="flex flex-wrap items-center gap-2">
                        <button
                          onClick={() => setSimulationActive(!simulationActive)}
                          className={`px-4 py-2 rounded-xl text-xs font-bold transition shadow-xs ${
                            simulationActive 
                              ? 'bg-amber-500 hover:bg-amber-600 text-white animate-pulse' 
                              : 'bg-blue-600 hover:bg-blue-700 text-white'
                          }`}
                        >
                          {simulationActive ? t[lang].stopSim : t[lang].startSim}
                        </button>

                        <button
                          onClick={() => setIsVolunteerAuthenticated(false)}
                          className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition"
                        >
                          🔒 {t[lang].logout}
                        </button>
                      </div>
                    </div>

                    {/* การ์ดสรุปตัวเลขภาพรวม */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                      <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <div className="text-xs text-slate-500 font-medium">{t[lang].totalHouseholds}</div>
                        <div className="text-2xl font-bold text-slate-900 mt-1">{households.length}</div>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <div className="text-xs text-slate-500 font-medium">{t[lang].waitingQueue}</div>
                        <div className="text-2xl font-bold text-amber-600 mt-1">
                          {households.filter(h => h.status === 'waiting').length}
                        </div>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <div className="text-xs text-slate-500 font-medium">{t[lang].volunteersNearbyCount}</div>
                        <div className="text-2xl font-bold text-blue-600 mt-1">
                          {households.filter(h => h.status === 'nearby').length}
                        </div>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <div className="text-xs text-slate-500 font-medium">{t[lang].completedDeliveries}</div>
                        <div className="text-2xl font-bold text-emerald-600 mt-1">
                          {households.filter(h => h.status === 'delivered').length}
                        </div>
                      </div>
                    </div>

                    {/* แผนที่รวม + รายการคิวจัดส่ง */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                      
                      {/* แผนที่สั่งการกรุงเทพฯ */}
                      <div className="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-col h-[500px] lg:h-[600px]">
                        <div className="mb-2.5 flex flex-wrap justify-between items-center gap-2 text-xs">
                          <span className="font-bold text-slate-800">🗺️ แผนที่ปฏิบัติการอาสาสมัคร (กทม.)</span>
                          <div className="flex items-center gap-3 text-[11px] text-slate-600">
                            <span>🛏️ ติดเตียง</span>
                            <span>👴 สูงอายุ</span>
                            <span>📦 ทั่วไป</span>
                            <span>🚐 ทีมอาสา (วงกลม 500ม.)</span>
                          </div>
                        </div>
                        <div className="flex-1 w-full rounded-xl overflow-hidden border border-slate-200">
                          <BangkokGoogleMap 
                            households={households}
                            volunteers={volunteers}
                            mode="volunteer"
                            focusCoords={focusCoords}
                            lang={lang}
                          />
                        </div>
                      </div>

                      {/* คิวจัดส่งสิ่งของ */}
                      <div className="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col h-[600px]">
                        <div className="mb-3">
                          <h3 className="text-base font-bold text-slate-900">{t[lang].queueTitle}</h3>
                          <input
                            type="text"
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            placeholder={t[lang].searchPlaceholder}
                            className="mt-2 w-full px-3 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                          />
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                          {sortedQueue.map((h) => {
                            const distMeters = getNearestVolunteerDist(h);
                            const isUrgent = h.bedridden || h.elderly;

                            return (
                              <div 
                                key={h.id}
                                onClick={() => setFocusCoords({ lat: h.lat, lng: h.lng })}
                                className={`p-4 rounded-xl border transition cursor-pointer ${
                                  h.status === 'delivered'
                                    ? 'bg-slate-50 border-slate-200 opacity-65'
                                    : h.status === 'nearby'
                                    ? 'bg-amber-50/70 border-amber-300'
                                    : isUrgent
                                    ? 'bg-rose-50/40 border-rose-200 hover:border-rose-400'
                                    : 'bg-white border-slate-200 hover:border-slate-300'
                                }`}
                              >
                                <div className="flex justify-between items-start gap-2">
                                  <div>
                                    <div className="flex items-center gap-1.5 flex-wrap">
                                      <span className="font-bold text-sm text-slate-900">{h.name}</span>
                                      {h.bedridden && (
                                        <span className="bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                                          🛏️ ผู้ป่วยติดเตียง
                                        </span>
                                      )}
                                      {h.elderly && (
                                        <span className="bg-orange-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                                          👴 ผู้สูงอายุ
                                        </span>
                                      )}
                                    </div>
                                    <p className="text-xs text-slate-600 mt-1">📍 {h.addressName} ({h.roomFloor})</p>
                                    <p className="text-xs text-slate-500">📞 {h.phone}</p>
                                  </div>

                                  <div className="text-right flex-shrink-0">
                                    <span className={`inline-block text-[11px] font-bold px-2 py-0.5 rounded-md ${
                                      h.status === 'delivered' ? 'bg-emerald-100 text-emerald-800' :
                                      h.status === 'nearby' ? 'bg-amber-200 text-amber-900' :
                                      'bg-slate-100 text-slate-700'
                                    }`}>
                                      {h.status === 'delivered' ? 'ส่งแล้ว' : h.status === 'nearby' ? 'ใกล้ถึง (<500ม.)' : `${distMeters} ม.`}
                                    </span>
                                  </div>
                                </div>

                                {h.status !== 'delivered' && (
                                  <div className="mt-3 pt-2.5 border-t border-slate-100 flex justify-end">
                                    <button
                                      type="button"
                                      onClick={(e) => {
                                        e.stopPropagation();
                                        markDelivered(h.id);
                                      }}
                                      className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg transition"
                                    >
                                      ✓ {t[lang].markDone}
                                    </button>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>

                    </div>
                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
